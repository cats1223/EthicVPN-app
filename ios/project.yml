# Generate the Xcode project with XcodeGen:  brew install xcodegen && xcodegen
name: EthicVPN
options:
  bundleIdPrefix: com.ethic
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: ru
settings:
  base:
    DEVELOPMENT_TEAM: ""   # set your Apple Developer Team ID
    SWIFT_VERSION: "5.9"
    # CI passes the release tag (v1.2.0 -> 1.2.0); the update check compares it with the latest release.
    MARKETING_VERSION: "1.1.0"
    # The full version with a beta suffix (1.2.0-beta.1); CFBundleShortVersionString only takes numbers.
    APP_DISPLAY_VERSION: $(MARKETING_VERSION)
    CURRENT_PROJECT_VERSION: "1"
    # CI overrides these from the provisioning profiles (scripts/ci/ios-sign.sh).
    APP_BUNDLE_ID: com.ethic.vpn
    TUNNEL_BUNDLE_ID: $(APP_BUNDLE_ID).tunnel
    APP_GROUP_ID: group.com.ethic.vpn

targets:
  EthicVPN:
    type: application
    platform: iOS
    sources:
      - EthicVPN
      - Shared
      - Intents
      - Localization
      # Shown as "what's new" after an update.
      - path: ../CHANGELOG.md
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        PROVISIONING_PROFILE_SPECIFIER: $(APP_PROFILE)
        INFOPLIST_FILE: EthicVPN/Info.plist
        CODE_SIGN_ENTITLEMENTS: EthicVPN/EthicVPN.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - target: PacketTunnel
        embed: true
      - target: EthicWidget
        embed: true

  PacketTunnel:
    type: app-extension
    platform: iOS
    sources:
      - PacketTunnel
      - Shared
      - Localization
      # Russian IP ranges and sites for split tunneling (scripts/update-geodata.py), copied as a folder.
      - path: ../geodata
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TUNNEL_BUNDLE_ID)
        PROVISIONING_PROFILE_SPECIFIER: $(TUNNEL_PROFILE)
        INFOPLIST_FILE: PacketTunnel/Info.plist
        CODE_SIGN_ENTITLEMENTS: PacketTunnel/PacketTunnel.entitlements
        # gomobile frameworks carry no bitcode and need libresolv for Go's DNS client.
        OTHER_LDFLAGS: ["-lresolv"]
    dependencies:
      # Built by scripts/build-libxray.sh
      - framework: Frameworks/LibXray.xcframework
        embed: false
      - sdk: NetworkExtension.framework

  # Home screen widget. Interactive widgets need iOS 17; the toggle's
  # intent runs in the app, so the extension needs no VPN entitlement or App Group.
  EthicWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Widget
      - Intents
      - Localization
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).widget
        INFOPLIST_FILE: Widget/Info.plist
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) WIDGET
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework

  EthicVPNTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
      - Shared
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  EthicVPN:
    build:
      targets:
        EthicVPN: all
    test:
      targets:
        - EthicVPNTests
